<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HalkyLauncher — Вхід виконано</title>
  <link rel="icon" type="image/webp" href="https://raw.githubusercontent.com/oleksandr1811/HalkyLauncher/develop/docs/favicon.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#07070f;
      --bdr:rgba(255,255,255,.07);--bdrh:rgba(168,85,247,.45);
      --p:#a855f7;--pl:#c084fc;
      --t:#f1f5f9;--t2:#94a3b8;--t3:#64748b;
      --grad:linear-gradient(135deg,#a855f7 0%,#ec4899 55%,#f5c2e7 100%);
      --glow:0 0 60px rgba(168,85,247,.2);
      --rs:8px;--ease:.3s cubic-bezier(.4,0,.2,1);
    }
    html,body{height:100%}
    body{
      font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
      background:var(--bg);color:var(--t);
      display:flex;align-items:center;justify-content:center;
      min-height:100vh;
      -webkit-font-smoothing:antialiased;
      overflow:hidden;
    }

    .bg{position:fixed;inset:0;pointer-events:none;z-index:0}
    .bg-radial{
      position:absolute;inset:0;
      background:
        radial-gradient(ellipse 80% 50% at 50% 0%,rgba(168,85,247,.2) 0%,transparent 65%),
        radial-gradient(ellipse 40% 40% at 80% 90%,rgba(236,72,153,.1) 0%,transparent 55%);
    }
    .bg-grid{
      position:absolute;inset:0;
      background-image:
        linear-gradient(rgba(168,85,247,.025) 1px,transparent 1px),
        linear-gradient(90deg,rgba(168,85,247,.025) 1px,transparent 1px);
      background-size:64px 64px;
      mask-image:radial-gradient(ellipse 70% 70% at 50% 50%,black,transparent);
    }

    /* LANG SWITCHER */
    .lang-sw{
      position:fixed;top:18px;right:18px;z-index:10;
      display:flex;align-items:center;gap:2px;
      background:rgba(255,255,255,.04);
      border:1px solid var(--bdr);border-radius:var(--rs);padding:3px;
    }
    .lang-btn{
      padding:5px 9px;border-radius:5px;font-size:.7rem;font-weight:700;
      letter-spacing:.06em;color:var(--t3);background:transparent;
      border:none;cursor:pointer;transition:var(--ease);line-height:1;
    }
    .lang-btn.on{background:rgba(168,85,247,.18);color:var(--pl)}
    .lang-btn:hover:not(.on){color:var(--t2)}

    .card{
      position:relative;z-index:1;
      text-align:center;
      padding:56px 48px;
      max-width:460px;
      width:calc(100% - 32px);
      background:rgba(255,255,255,.03);
      border:1px solid rgba(168,85,247,.2);
      border-radius:28px;
      box-shadow:var(--glow),0 8px 40px rgba(0,0,0,.5);
      animation:aFadeUp .55s cubic-bezier(.4,0,.2,1) both;
    }
    .card::before{
      content:'';position:absolute;inset:0;border-radius:28px;
      background:linear-gradient(135deg,rgba(168,85,247,.06) 0%,rgba(236,72,153,.03) 100%);
      pointer-events:none;
    }

    .logo{
      width:72px;height:72px;border-radius:18px;
      margin:0 auto 24px;
      filter:drop-shadow(0 0 24px rgba(168,85,247,.5));
      display:block;
    }

    .check{
      width:62px;height:62px;
      border-radius:50%;
      background:linear-gradient(135deg,rgba(168,85,247,.15),rgba(236,72,153,.1));
      border:1px solid rgba(168,85,247,.3);
      display:flex;align-items:center;justify-content:center;
      margin:0 auto 28px;
    }
    .check svg{width:28px;height:28px;flex-shrink:0}

    h1{
      font-size:1.6rem;font-weight:800;line-height:1.2;
      margin-bottom:12px;
      background:linear-gradient(135deg,#fff 0%,#c084fc 50%,#f5c2e7 100%);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
    }

    .sub{
      font-size:.95rem;color:var(--t2);line-height:1.7;
    }
    .sub strong{
      background:var(--grad);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
      font-weight:700;
    }

    .divider{
      width:48px;height:2px;
      background:var(--grad);
      border-radius:1px;
      margin:28px auto 0;
      opacity:.5;
    }

    @keyframes aFadeUp{
      from{opacity:0;transform:translateY(24px)}
      to{opacity:1;transform:none}
    }

    @media(max-width:480px){
      .card{padding:40px 28px}
      h1{font-size:1.35rem}
      .lang-sw{top:12px;right:12px}
    }
  </style>
</head>
<body>

<div class="bg">
  <div class="bg-radial"></div>
  <div class="bg-grid"></div>
</div>

<div class="lang-sw">
  <button class="lang-btn" data-lang="uk">UK</button>
  <button class="lang-btn" data-lang="en">EN</button>
  <button class="lang-btn" data-lang="de">DE</button>
</div>

<div class="card">
  <img src="https://raw.githubusercontent.com/oleksandr1811/HalkyLauncher/develop/docs/favicon.webp"
       alt="HalkyLauncher" class="logo" width="72" height="72">

  <div class="check">
    <svg viewBox="0 0 24 24" fill="none" stroke="url(#g)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <defs>
        <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#a855f7"/>
          <stop offset="100%" stop-color="#ec4899"/>
        </linearGradient>
      </defs>
      <polyline points="20 6 9 17 4 12"/>
    </svg>
  </div>

  <h1 data-i18n="title"></h1>
  <p class="sub" data-i18n-html="sub"></p>
  <div class="divider"></div>
</div>

<script>
'use strict';
const I18N = {
  uk: {
    title: 'Вхід виконано успішно',
    sub:   'Продовжіть у <strong>HalkyLauncher</strong>.',
  },
  en: {
    title: 'Signed in successfully',
    sub:   'Continue in <strong>HalkyLauncher</strong>.',
  },
  de: {
    title: 'Anmeldung erfolgreich',
    sub:   'Weiter im <strong>HalkyLauncher</strong>.',
  },
};

function detectLang() {
  const saved = localStorage.getItem('hl-lang');
  if (saved && I18N[saved]) return saved;
  for (const l of (navigator.languages || [navigator.language || 'en'])) {
    const c = l.toLowerCase().split('-')[0];
    if (I18N[c]) return c;
  }
  return 'en';
}

let LANG = detectLang();

function applyLang(lang) {
  LANG = lang;
  localStorage.setItem('hl-lang', lang);
  document.documentElement.lang = lang;
  const d = I18N[lang] || I18N.en;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = d[el.dataset.i18n] || ''; });
  document.querySelectorAll('[data-i18n-html]').forEach(el => { el.innerHTML = d[el.dataset.i18nHtml] || ''; });
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('on', b.dataset.lang === lang));
}

document.querySelectorAll('.lang-btn').forEach(b => b.addEventListener('click', () => applyLang(b.dataset.lang)));

applyLang(LANG);
</script>
</body>
</html>
